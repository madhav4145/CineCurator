<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Search — CineCurator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/features.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

<a href="#main" class="visually-hidden">Skip to content</a>

<header class="navbar">
  <div class="navbar__inner">
    <a href="index.html" class="navbar__logo"><i class="fa-solid fa-film"></i> Cine<span>Curator</span></a>
    <nav class="navbar__menu" id="navbar-menu" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="search.html?type=movie">Movies</a>
      <a href="search.html?type=series">Series</a>
      <a href="search.html?type=series">TV Shows</a>
      <a href="favorites.html">Favorites</a>
      <a href="watchlist.html">Watchlist</a>
    </nav>
    <div class="navbar__actions">
      <a class="navbar__search-link is-current" href="search.html" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></a>
      <button class="navbar__dice" type="button" aria-label="Surprise me with a random title" title="Surprise me"><i class="fa-solid fa-dice"></i></button>
      <button class="theme-toggle" type="button" aria-label="Toggle dark or light mode"><i class="fa-solid fa-moon"></i></button>
      <button class="navbar__burger" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="navbar-menu"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>
</header>

<main id="main">
  <div class="container">
    <header class="page-header">
      <h1 class="page-header__title"><i class="fa-solid fa-magnifying-glass"></i> Search</h1>
      <p class="page-header__meta">Find any movie, series or TV show in the OMDb catalog.</p>
    </header>

    <div class="filter-bar">
      <form class="search-form" id="search-form" role="search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <label for="search-input" class="visually-hidden">Search titles</label>
        <input id="search-input" type="text" placeholder="Search by title…" autocomplete="off" />
        <button type="submit">Search</button>
      </form>

      <label for="filter-type" class="visually-hidden">Filter by type</label>
      <select id="filter-type" class="select">
        <option value="">All Types</option>
        <option value="movie">Movies</option>
        <option value="series">Series / TV Shows</option>
        <option value="episode">Episodes</option>
      </select>

      <label for="filter-year" class="visually-hidden">Filter by year</label>
      <select id="filter-year" class="select"></select>

      <label for="filter-sort" class="visually-hidden">Sort by</label>
      <select id="filter-sort" class="select">
        <option value="relevance">Sort: Relevance</option>
        <option value="title-asc">Title A–Z</option>
        <option value="title-desc">Title Z–A</option>
        <option value="year-desc">Year: Newest</option>
        <option value="year-asc">Year: Oldest</option>
      </select>
    </div>

    <div class="recent-row" id="recent-searches"></div>
    <button type="button" class="link-btn" id="clear-recent" style="margin: -14px 0 20px;">Clear recent searches</button>

    <p class="results-count" id="results-count"></p>
    <div class="grid" id="search-results"></div>
    <nav class="pagination" id="pagination" aria-label="Search results pages"></nav>
  </div>
</main>

<footer class="site-footer">
  <div class="container site-footer__inner">
    <span>© 2026 CineCurator | Designed & Developed by Madhav</span>
    <span><a href="favorites.html">Favorites</a> · <a href="watchlist.html">Watchlist</a> · <a href="cinematch.html">CineMatch</a> · <a href="stats.html">My Stats</a></span>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script>
  // populate year filter dynamically (current year down to 1950)
  (function () {
    const sel = document.getElementById('filter-year');
    const current = new Date().getFullYear();
    let opts = '<option value="">All Years</option>';
    for (let y = current; y >= 1950; y--) opts += `<option value="${y}">${y}</option>`;
    sel.innerHTML = opts;
    const params = new URLSearchParams(window.location.search);
    if (params.get('year')) sel.value = params.get('year');
  })();
</script>
<script src="js/search.js"></script>
</body>
</html>
